</style>
<rect class="bg" x="0.5" y="0.5" width="419" height="205" rx="6"/><text class="title" x="24" y="38">GitHub activity</text><text class="label" x="24" y="74">Contributions, last 12 months</text><text class="value" x="396" y="74" text-anchor="end">1,186</text><text class="label" x="24" y="100">Contributions, all time</text><text class="value" x="396" y="100" text-anchor="end">1,359</text><text class="label" x="24" y="126">Pull requests, last 12 months</text><text class="value" x="396" y="126" text-anchor="end">4</text><text class="label" x="24" y="152">Repositories</text><text class="value" x="396" y="152" text-anchor="end">5 public · 15 private</text><text class="note" x="24" y="190">Includes private repositories</text></svg>
